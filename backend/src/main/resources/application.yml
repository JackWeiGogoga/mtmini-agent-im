server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      force: true
      enabled: true
      charset: utf-8
  tomcat:
    mbeanregistry:
      enabled: true
    max-http-form-post-size: -1
    background-processor-delay: 30
    redirect-context-root: true
    uri-encoding: UTF-8
    basedir: ./
    accesslog:
      enabled: true
      buffered: true
      directory: logs
      file-date-format: .yyyy-MM-dd
      pattern: '%h %l %u %t "%r" %s %b %{ms}Tms "%{Referer}i" "%{User-Agent}i" "%{X-Request-ID}i" "%{X-Forwarded-For}i"'
      prefix: access_log
      rename-on-rotate: false
      request-attributes-enabled: false
      rotate: true
      suffix: .log

spring:
  config:
    import: classpath:sensitive-words.yml
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:60s}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/project-template?useUnicode=true&characterEncoding=UTF8&autoReconnect=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  servlet:
    multipart:
      enabled: true
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:20MB}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gogoga.backend.entity
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

logging:
  level:
    root: INFO
    "[com.gogoga.backend]": INFO
    "[com.gogoga.backend.mapper]": INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

llm:
  openai-compatible:
    default-provider: ${LLM_OPENAI_COMPATIBLE_DEFAULT_PROVIDER:OPENAI}
    default-base-url: ${LLM_OPENAI_COMPATIBLE_DEFAULT_BASE_URL:https://api.lkeap.cloud.tencent.com/v1}
    default-api-key: ${LLM_OPENAI_COMPATIBLE_DEFAULT_API_KEY:}
  rate-limit:
    enabled: ${LLM_RATE_LIMIT_ENABLED:true}
    observe-only: ${LLM_RATE_LIMIT_OBSERVE_ONLY:false}
    default-effective-rpm: ${LLM_RATE_LIMIT_DEFAULT_EFFECTIVE_RPM:30}
    default-burst: ${LLM_RATE_LIMIT_DEFAULT_BURST:1}
    short-wait-millis: ${LLM_RATE_LIMIT_SHORT_WAIT_MILLIS:5000}
    max-wait-millis: ${LLM_RATE_LIMIT_MAX_WAIT_MILLIS:120000}
    interactive-max-wait-millis: ${LLM_RATE_LIMIT_INTERACTIVE_MAX_WAIT_MILLIS:2000}
    default-cooldown-seconds: ${LLM_RATE_LIMIT_DEFAULT_COOLDOWN_SECONDS:60}
    state-ttl-seconds: ${LLM_RATE_LIMIT_STATE_TTL_SECONDS:180}
    reschedule-jitter-millis: ${LLM_RATE_LIMIT_RESCHEDULE_JITTER_MILLIS:3000}
    rules:
      - provider: TOKENHUB
        model: deepseek-v4-flash
        effective-rpm: ${LLM_RATE_LIMIT_TOKENHUB_DEEPSEEK_V4_FLASH_RPM:50}
        burst: ${LLM_RATE_LIMIT_TOKENHUB_DEEPSEEK_V4_FLASH_BURST:1}

oauth:
  success-url: ${OAUTH_SUCCESS_URL:http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/callback/google}
  github:
    client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
    client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:5173/oauth/callback/github}

sms:
  mock-enabled: ${SMS_MOCK_ENABLED:false}
  code-expire-seconds: 300
  send-interval-seconds: 60
  daily-send-limit: 20
  verify-fail-limit: 5
  ip-minute-send-limit: 10
  ip-daily-send-limit: 100
  tencent:
    secret-id: ${TENCENT_SMS_SECRET_ID:your-secret-id}
    secret-key: ${TENCENT_SMS_SECRET_KEY:your-secret-key}
    sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:1400000000}
    sign-name: ${TENCENT_SMS_SIGN_NAME:your-sign-name}
    login-template-id: ${TENCENT_SMS_LOGIN_TEMPLATE_ID:000000}
    region: ${TENCENT_SMS_REGION:ap-guangzhou}
    endpoint: ${TENCENT_SMS_ENDPOINT:sms.tencentcloudapi.com}
  business:
    enabled: ${SMS_BUSINESS_ENABLED:false}
    worker-enabled: ${SMS_BUSINESS_WORKER_ENABLED:true}
    expiry-planner-enabled: ${SMS_BUSINESS_EXPIRY_PLANNER_ENABLED:true}
    delivery-mode: ${SMS_BUSINESS_DELIVERY_MODE:LOG_ONLY}
    application-name: ${SMS_BUSINESS_APPLICATION_NAME:AI智能体消息管理}
    purchase-guide-template-id: ${TENCENT_SMS_PURCHASE_GUIDE_TEMPLATE_ID:2685915}
    power-exhausted-template-id: ${TENCENT_SMS_POWER_EXHAUSTED_TEMPLATE_ID:2687571}
    app-expired-template-id: ${TENCENT_SMS_APP_EXPIRED_TEMPLATE_ID:2687569}
    zone-id: ${SMS_BUSINESS_ZONE_ID:Asia/Shanghai}
    poll-size: ${SMS_BUSINESS_POLL_SIZE:20}
    planner-batch-size: ${SMS_BUSINESS_PLANNER_BATCH_SIZE:200}
    max-retry-count: ${SMS_BUSINESS_MAX_RETRY_COUNT:3}
    timeout-seconds: ${SMS_BUSINESS_TIMEOUT_SECONDS:180}
    initial-backoff-seconds: ${SMS_BUSINESS_INITIAL_BACKOFF_SECONDS:30}
    max-backoff-seconds: ${SMS_BUSINESS_MAX_BACKOFF_SECONDS:300}
    poll-delay-ms: ${SMS_BUSINESS_POLL_DELAY_MS:1000}
    recovery-delay-ms: ${SMS_BUSINESS_RECOVERY_DELAY_MS:30000}
    expiry-planner-cron: ${SMS_BUSINESS_EXPIRY_PLANNER_CRON:0 */10 * * * ?}

cos:
  enabled: ${COS_ENABLED:true}
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:ap-beijing}
  bucket: ${COS_BUCKET:mtmini-receipt-code-1311487792}
  public-access-url-base: ${COS_PUBLIC_ACCESS_URL_BASE:}
  receipt-code:
    key-prefix: ${COS_RECEIPT_CODE_KEY_PREFIX:sales/receipt-code}
    private-read: ${COS_RECEIPT_CODE_PRIVATE_READ:true}
    access-url-expire-seconds: ${COS_RECEIPT_CODE_ACCESS_URL_EXPIRE_SECONDS:1800}
    max-file-size: ${COS_RECEIPT_CODE_MAX_FILE_SIZE:2MB}

scheduled:
  enabled: ${SCHEDULED_ENABLED:true}

mt:
  developer-id: ${MT_DEVELOPER_ID:}
  sign-key: ${MT_SIGN_KEY:}
  business-id: ${MT_BUSINESS_ID:16}
  callback-success-url: ${MT_CALLBACK_SUCCESS_URL:https://aic.waimaidashi.com/#/}
  api:
    dry-run: ${MT_API_DRY_RUN:false}
    im-send-dry-run: ${MT_API_IM_SEND_DRY_RUN:false}
    dry-run-reschedule-seconds: ${MT_API_DRY_RUN_RESCHEDULE_SECONDS:3600}
  h5:
    app-key: ${MT_H5_APP_KEY:}
  token:
    refresh-cron: ${MT_TOKEN_REFRESH_CRON:0 */10 * * * ?}
    refresh-before-expiry-seconds: ${MT_TOKEN_REFRESH_BEFORE_EXPIRY_SECONDS:1800}
    history:
      encryption-key: ${MT_TOKEN_HISTORY_ENCRYPTION_KEY:local-dev-token-history-key-change-me}
      fingerprint-key: ${MT_TOKEN_HISTORY_FINGERPRINT_KEY:}
  app-order:
    pull-cron: ${MT_APP_ORDER_PULL_CRON:0 0/30 * * * ?}
    app-id: ${MT_APP_ORDER_APP_ID:154}
    page-size: ${MT_APP_ORDER_PAGE_SIZE:100}
    lookback-seconds: ${MT_APP_ORDER_LOOKBACK_SECONDS:172800}
  async-task:
    enabled: ${MT_ASYNC_TASK_ENABLED:true}
    worker-enabled: ${MT_ASYNC_TASK_WORKER_ENABLED:true}
    poll-size: ${MT_ASYNC_TASK_POLL_SIZE:20}
    poll-delay-ms: ${MT_ASYNC_TASK_POLL_DELAY_MS:1000}
    recovery-delay-ms: ${MT_ASYNC_TASK_RECOVERY_DELAY_MS:30000}
    recovery-limit: ${MT_ASYNC_TASK_RECOVERY_LIMIT:20}
    executor-core-pool-size: ${MT_ASYNC_TASK_EXECUTOR_CORE_POOL_SIZE:4}
    executor-max-pool-size: ${MT_ASYNC_TASK_EXECUTOR_MAX_POOL_SIZE:8}
    executor-queue-capacity: ${MT_ASYNC_TASK_EXECUTOR_QUEUE_CAPACITY:200}
    llm-executor-concurrency: ${MT_ASYNC_TASK_LLM_EXECUTOR_CONCURRENCY:2}
    llm-task-weights:
      knowledge-document-parse: ${MT_ASYNC_TASK_LLM_WEIGHT_KNOWLEDGE_DOCUMENT_PARSE:1}
      im-auto-reply: ${MT_ASYNC_TASK_LLM_WEIGHT_IM_AUTO_REPLY:5}
    cleanup:
      enabled: ${MT_ASYNC_TASK_CLEANUP_ENABLED:false}
      delay-ms: ${MT_ASYNC_TASK_CLEANUP_DELAY_MS:3600000}
      batch-size: ${MT_ASYNC_TASK_CLEANUP_BATCH_SIZE:1000}
      success-retention-days: ${MT_ASYNC_TASK_CLEANUP_SUCCESS_RETENTION_DAYS:7}
      dead-retention-days: ${MT_ASYNC_TASK_CLEANUP_DEAD_RETENTION_DAYS:30}
      lock-seconds: ${MT_ASYNC_TASK_CLEANUP_LOCK_SECONDS:300}
    auth-sync-rights:
      max-retry-count: ${MT_ASYNC_TASK_AUTH_SYNC_RIGHTS_MAX_RETRY_COUNT:3}
      timeout-seconds: ${MT_ASYNC_TASK_AUTH_SYNC_RIGHTS_TIMEOUT_SECONDS:180}
      initial-backoff-seconds: ${MT_ASYNC_TASK_AUTH_SYNC_RIGHTS_INITIAL_BACKOFF_SECONDS:60}
      max-backoff-seconds: ${MT_ASYNC_TASK_AUTH_SYNC_RIGHTS_MAX_BACKOFF_SECONDS:900}
    auth-backfill-poi-id:
      max-retry-count: ${MT_ASYNC_TASK_AUTH_BACKFILL_POI_ID_MAX_RETRY_COUNT:3}
      timeout-seconds: ${MT_ASYNC_TASK_AUTH_BACKFILL_POI_ID_TIMEOUT_SECONDS:180}
      initial-backoff-seconds: ${MT_ASYNC_TASK_AUTH_BACKFILL_POI_ID_INITIAL_BACKOFF_SECONDS:60}
      max-backoff-seconds: ${MT_ASYNC_TASK_AUTH_BACKFILL_POI_ID_MAX_BACKOFF_SECONDS:900}
    auth-configure-im:
      max-retry-count: ${MT_ASYNC_TASK_AUTH_CONFIGURE_IM_MAX_RETRY_COUNT:3}
      timeout-seconds: ${MT_ASYNC_TASK_AUTH_CONFIGURE_IM_TIMEOUT_SECONDS:180}
      initial-backoff-seconds: ${MT_ASYNC_TASK_AUTH_CONFIGURE_IM_INITIAL_BACKOFF_SECONDS:60}
      max-backoff-seconds: ${MT_ASYNC_TASK_AUTH_CONFIGURE_IM_MAX_BACKOFF_SECONDS:900}
    knowledge-document-parse:
      max-retry-count: ${MT_ASYNC_TASK_KNOWLEDGE_DOCUMENT_PARSE_MAX_RETRY_COUNT:3}
      timeout-seconds: ${MT_ASYNC_TASK_KNOWLEDGE_DOCUMENT_PARSE_TIMEOUT_SECONDS:600}
      initial-backoff-seconds: ${MT_ASYNC_TASK_KNOWLEDGE_DOCUMENT_PARSE_INITIAL_BACKOFF_SECONDS:60}
      max-backoff-seconds: ${MT_ASYNC_TASK_KNOWLEDGE_DOCUMENT_PARSE_MAX_BACKOFF_SECONDS:900}
    im-auto-reply:
      max-retry-count: ${MT_ASYNC_TASK_IM_AUTO_REPLY_MAX_RETRY_COUNT:5}
      timeout-seconds: ${MT_ASYNC_TASK_IM_AUTO_REPLY_TIMEOUT_SECONDS:180}
      initial-backoff-seconds: ${MT_ASYNC_TASK_IM_AUTO_REPLY_INITIAL_BACKOFF_SECONDS:5}
      max-backoff-seconds: ${MT_ASYNC_TASK_IM_AUTO_REPLY_MAX_BACKOFF_SECONDS:300}
  im:
    secret: ${MT_IM_SECRET:}
    callback-business-id: ${MT_IM_CALLBACK_BUSINESS_ID:2}
    callback-debug-log: ${MT_IM_CALLBACK_DEBUG_LOG:false}
  im-auto-reply:
    enabled: ${MT_IM_AUTO_REPLY_ENABLED:false}
    session-idle-minutes: ${MT_IM_AUTO_REPLY_SESSION_IDLE_MINUTES:30}
    history-max-rounds: ${MT_IM_AUTO_REPLY_HISTORY_MAX_ROUNDS:100}
    debounce-millis: ${MT_IM_AUTO_REPLY_DEBOUNCE_MILLIS:2000}
    merchant-hold-seconds: ${MT_IM_AUTO_REPLY_MERCHANT_HOLD_SECONDS:40}
    send-delay-min-seconds: ${MT_IM_AUTO_REPLY_SEND_DELAY_MIN_SECONDS:3}
    send-delay-max-seconds: ${MT_IM_AUTO_REPLY_SEND_DELAY_MAX_SECONDS:10}
    max-context-chars: ${MT_IM_AUTO_REPLY_MAX_CONTEXT_CHARS:24000}
    max-completion-tokens: ${MT_IM_AUTO_REPLY_MAX_COMPLETION_TOKENS:512}
    temperature: ${MT_IM_AUTO_REPLY_TEMPERATURE:0.3}
    rag-recent-user-messages: ${MT_IM_AUTO_REPLY_RAG_RECENT_USER_MESSAGES:3}
    lock-lease-seconds: ${MT_IM_AUTO_REPLY_LOCK_LEASE_SECONDS:60}
    lock-renew-seconds: ${MT_IM_AUTO_REPLY_LOCK_RENEW_SECONDS:20}
    model-provider: ${MT_IM_AUTO_REPLY_MODEL_PROVIDER:${MT_KNOWLEDGE_MODEL_PROVIDER:TOKENHUB}}
    model-base-url: ${MT_IM_AUTO_REPLY_MODEL_BASE_URL:${MT_KNOWLEDGE_MODEL_BASE_URL:https://tokenhub.tencentmaas.com/v1}}
    model-api-key: ${MT_IM_AUTO_REPLY_MODEL_API_KEY:${MT_KNOWLEDGE_MODEL_API_KEY:}}
    chat-model: ${MT_IM_AUTO_REPLY_CHAT_MODEL:${MT_KNOWLEDGE_CHAT_MODEL:deepseek-v4-flash}}
    safe-fallback-reply: ${MT_IM_AUTO_REPLY_SAFE_FALLBACK_REPLY:抱歉，我暂时无法准确回答这个问题，请联系门店人工客服。}
    non-text-fallback-reply: ${MT_IM_AUTO_REPLY_NON_TEXT_FALLBACK_REPLY:商家正在忙}
  im-broadcast:
    enabled: ${MT_IM_BROADCAST_ENABLED:true}
    schedule-cron: ${MT_IM_BROADCAST_SCHEDULE_CRON:0 * * * * ?}
    schedule-lock-seconds: ${MT_IM_BROADCAST_SCHEDULE_LOCK_SECONDS:50}
    schedule-page-size: ${MT_IM_BROADCAST_SCHEDULE_PAGE_SIZE:200}
    active-within-days: ${MT_IM_BROADCAST_ACTIVE_WITHIN_DAYS:30}
    max-targets-per-batch: ${MT_IM_BROADCAST_MAX_TARGETS_PER_BATCH:5000}
    plan-page-size: ${MT_IM_BROADCAST_PLAN_PAGE_SIZE:500}
    shard-size: ${MT_IM_BROADCAST_SHARD_SIZE:500}
    trigger-jitter-seconds: ${MT_IM_BROADCAST_TRIGGER_JITTER_SECONDS:60}
    executor-concurrency: ${MT_IM_BROADCAST_EXECUTOR_CONCURRENCY:4}
    shop-concurrency: ${MT_IM_BROADCAST_SHOP_CONCURRENCY:1}
    global-qps: ${MT_IM_BROADCAST_GLOBAL_QPS:20}
    throttle-backoff-millis: ${MT_IM_BROADCAST_THROTTLE_BACKOFF_MILLIS:2000}
    persist-timeline-message: ${MT_IM_BROADCAST_PERSIST_TIMELINE_MESSAGE:true}
    max-content-length: ${MT_IM_BROADCAST_MAX_CONTENT_LENGTH:100}
    plan-task:
      max-retry-count: ${MT_IM_BROADCAST_PLAN_MAX_RETRY_COUNT:3}
      timeout-seconds: ${MT_IM_BROADCAST_PLAN_TIMEOUT_SECONDS:600}
      initial-backoff-seconds: ${MT_IM_BROADCAST_PLAN_INITIAL_BACKOFF_SECONDS:30}
      max-backoff-seconds: ${MT_IM_BROADCAST_PLAN_MAX_BACKOFF_SECONDS:300}
    send-task:
      max-retry-count: ${MT_IM_BROADCAST_SEND_MAX_RETRY_COUNT:3}
      timeout-seconds: ${MT_IM_BROADCAST_SEND_TIMEOUT_SECONDS:1800}
      initial-backoff-seconds: ${MT_IM_BROADCAST_SEND_INITIAL_BACKOFF_SECONDS:30}
      max-backoff-seconds: ${MT_IM_BROADCAST_SEND_MAX_BACKOFF_SECONDS:600}
  sensitive-word:
    enabled: ${MT_SENSITIVE_WORD_ENABLED:true}
    max-rewrite-attempts: ${MT_SENSITIVE_WORD_MAX_REWRITE_ATTEMPTS:1}
  knowledge:
    enabled: ${MT_KNOWLEDGE_ENABLED:true}
    max-qa-items-per-shop: ${MT_KNOWLEDGE_MAX_QA_ITEMS_PER_SHOP:500}
    max-documents-per-shop: ${MT_KNOWLEDGE_MAX_DOCUMENTS_PER_SHOP:10}
    max-document-bytes: ${MT_KNOWLEDGE_MAX_DOCUMENT_BYTES:20971520}
    max-chunks-per-document: ${MT_KNOWLEDGE_MAX_CHUNKS_PER_DOCUMENT:500}
    max-search-candidates: ${MT_KNOWLEDGE_MAX_SEARCH_CANDIDATES:1000}
    top-k: ${MT_KNOWLEDGE_TOP_K:5}
    min-context-cosine-score: ${MT_KNOWLEDGE_MIN_CONTEXT_COSINE_SCORE:0.5}
    rag-balance-threshold: ${MT_KNOWLEDGE_RAG_BALANCE_THRESHOLD:10000}
    auth-grant-power-amount: ${MT_KNOWLEDGE_AUTH_GRANT_POWER_AMOUNT:${POWER_NEW_AUTHORIZED_SHOP_GRANT_AMOUNT:800000}}
    model-provider: ${MT_KNOWLEDGE_MODEL_PROVIDER:TOKENHUB}
    model-base-url: ${MT_KNOWLEDGE_MODEL_BASE_URL:https://tokenhub.tencentmaas.com/v1}
    model-api-key: ${MT_KNOWLEDGE_MODEL_API_KEY:}
    chat-model: ${MT_KNOWLEDGE_CHAT_MODEL:deepseek-v4-flash}
    embedding-provider: ${MT_KNOWLEDGE_EMBEDDING_PROVIDER:DASHSCOPE}
    embedding-base-url: ${MT_KNOWLEDGE_EMBEDDING_BASE_URL:https://llm-kz8j7o34hwdm6nb4.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    embedding-api-key: ${MT_KNOWLEDGE_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
    embedding-model: ${MT_KNOWLEDGE_EMBEDDING_MODEL:text-embedding-v4}
    embedding-dim: ${MT_KNOWLEDGE_EMBEDDING_DIM:1024}
    document-key-prefix: ${MT_KNOWLEDGE_DOCUMENT_KEY_PREFIX:knowledge/documents}
