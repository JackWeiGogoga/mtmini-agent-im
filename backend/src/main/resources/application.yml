server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      force: true
      enabled: true
      charset: utf-8
  tomcat:
    mbeanregistry:
      enabled: true
    max-http-form-post-size: -1
    background-processor-delay: 30
    redirect-context-root: true
    uri-encoding: UTF-8
    basedir: ./
    accesslog:
      enabled: true
      buffered: true
      directory: logs
      file-date-format: .yyyy-MM-dd
      pattern: '%h %l %u %t "%r" %s %b %{ms}Tms "%{Referer}i" "%{User-Agent}i" "%{X-Request-ID}i" "%{X-Forwarded-For}i"'
      prefix: access_log
      rename-on-rotate: false
      request-attributes-enabled: false
      rotate: true
      suffix: .log

spring:
  config:
    import: classpath:comment-reply-sensitive-words.yml
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:60s}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/project-template?useUnicode=true&characterEncoding=UTF8&autoReconnect=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  servlet:
    multipart:
      enabled: true
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:20MB}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gogoga.backend.entity
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

logging:
  level:
    root: INFO
    "[com.gogoga.backend]": INFO
    "[com.gogoga.backend.mapper]": INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

oauth:
  success-url: ${OAUTH_SUCCESS_URL:http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/callback/google}
  github:
    client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
    client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:5173/oauth/callback/github}

sms:
  mock-enabled: ${SMS_MOCK_ENABLED:false}
  code-expire-seconds: 300
  send-interval-seconds: 60
  daily-send-limit: 20
  verify-fail-limit: 5
  ip-minute-send-limit: 10
  ip-daily-send-limit: 100
  tencent:
    secret-id: ${TENCENT_SMS_SECRET_ID:your-secret-id}
    secret-key: ${TENCENT_SMS_SECRET_KEY:your-secret-key}
    sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:1400000000}
    sign-name: ${TENCENT_SMS_SIGN_NAME:your-sign-name}
    login-template-id: ${TENCENT_SMS_LOGIN_TEMPLATE_ID:000000}
    region: ${TENCENT_SMS_REGION:ap-guangzhou}
    endpoint: ${TENCENT_SMS_ENDPOINT:sms.tencentcloudapi.com}

cos:
  enabled: ${COS_ENABLED:true}
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:ap-beijing}
  bucket: ${COS_BUCKET:mtmini-receipt-code-1311487792}
  public-access-url-base: ${COS_PUBLIC_ACCESS_URL_BASE:}
  receipt-code:
    key-prefix: ${COS_RECEIPT_CODE_KEY_PREFIX:sales/receipt-code}
    private-read: ${COS_RECEIPT_CODE_PRIVATE_READ:true}
    access-url-expire-seconds: ${COS_RECEIPT_CODE_ACCESS_URL_EXPIRE_SECONDS:1800}
    max-file-size: ${COS_RECEIPT_CODE_MAX_FILE_SIZE:2MB}

scheduled:
  enabled: ${SCHEDULED_ENABLED:true}

mt:
  developer-id: ${MT_DEVELOPER_ID:}
  sign-key: ${MT_SIGN_KEY:}
  business-id: ${MT_BUSINESS_ID:16}
  callback-success-url: ${MT_CALLBACK_SUCCESS_URL:https://aib.waimaidashi.com/#/}
  h5:
    app-key: ${MT_H5_APP_KEY:}
  token:
    refresh-cron: ${MT_TOKEN_REFRESH_CRON:0 */10 * * * ?}
    refresh-before-expiry-seconds: ${MT_TOKEN_REFRESH_BEFORE_EXPIRY_SECONDS:1800}
    history:
      encryption-key: ${MT_TOKEN_HISTORY_ENCRYPTION_KEY:local-dev-token-history-key-change-me}
      fingerprint-key: ${MT_TOKEN_HISTORY_FINGERPRINT_KEY:}
  app-order:
    pull-cron: ${MT_APP_ORDER_PULL_CRON:0 0/30 * * * ?}
    app-id: ${MT_APP_ORDER_APP_ID:111}
    page-size: ${MT_APP_ORDER_PAGE_SIZE:100}
    lookback-seconds: ${MT_APP_ORDER_LOOKBACK_SECONDS:172800}
  async-task:
    enabled: ${MT_ASYNC_TASK_ENABLED:true}
    worker-enabled: ${MT_ASYNC_TASK_WORKER_ENABLED:true}
    poll-size: ${MT_ASYNC_TASK_POLL_SIZE:20}
    poll-delay-ms: ${MT_ASYNC_TASK_POLL_DELAY_MS:1000}
    recovery-delay-ms: ${MT_ASYNC_TASK_RECOVERY_DELAY_MS:30000}
    recovery-limit: ${MT_ASYNC_TASK_RECOVERY_LIMIT:20}
    executor-core-pool-size: ${MT_ASYNC_TASK_EXECUTOR_CORE_POOL_SIZE:4}
    executor-max-pool-size: ${MT_ASYNC_TASK_EXECUTOR_MAX_POOL_SIZE:8}
    executor-queue-capacity: ${MT_ASYNC_TASK_EXECUTOR_QUEUE_CAPACITY:200}
    cleanup:
      enabled: ${MT_ASYNC_TASK_CLEANUP_ENABLED:false}
      delay-ms: ${MT_ASYNC_TASK_CLEANUP_DELAY_MS:3600000}
      batch-size: ${MT_ASYNC_TASK_CLEANUP_BATCH_SIZE:1000}
      success-retention-days: ${MT_ASYNC_TASK_CLEANUP_SUCCESS_RETENTION_DAYS:7}
      dead-retention-days: ${MT_ASYNC_TASK_CLEANUP_DEAD_RETENTION_DAYS:30}
      lock-seconds: ${MT_ASYNC_TASK_CLEANUP_LOCK_SECONDS:300}
    auth-sync-rights:
      max-retry-count: ${MT_ASYNC_TASK_AUTH_SYNC_RIGHTS_MAX_RETRY_COUNT:3}
      timeout-seconds: ${MT_ASYNC_TASK_AUTH_SYNC_RIGHTS_TIMEOUT_SECONDS:180}
      initial-backoff-seconds: ${MT_ASYNC_TASK_AUTH_SYNC_RIGHTS_INITIAL_BACKOFF_SECONDS:60}
      max-backoff-seconds: ${MT_ASYNC_TASK_AUTH_SYNC_RIGHTS_MAX_BACKOFF_SECONDS:900}
    auth-comment-backfill:
      max-retry-count: ${MT_ASYNC_TASK_AUTH_COMMENT_BACKFILL_MAX_RETRY_COUNT:3}
      timeout-seconds: ${MT_ASYNC_TASK_AUTH_COMMENT_BACKFILL_TIMEOUT_SECONDS:300}
      initial-backoff-seconds: ${MT_ASYNC_TASK_AUTH_COMMENT_BACKFILL_INITIAL_BACKOFF_SECONDS:60}
      max-backoff-seconds: ${MT_ASYNC_TASK_AUTH_COMMENT_BACKFILL_MAX_BACKOFF_SECONDS:900}
    comment-auto-reply:
      max-retry-count: ${MT_ASYNC_TASK_COMMENT_AUTO_REPLY_MAX_RETRY_COUNT:3}
      timeout-seconds: ${MT_ASYNC_TASK_COMMENT_AUTO_REPLY_TIMEOUT_SECONDS:180}
      initial-backoff-seconds: ${MT_ASYNC_TASK_COMMENT_AUTO_REPLY_INITIAL_BACKOFF_SECONDS:60}
      max-backoff-seconds: ${MT_ASYNC_TASK_COMMENT_AUTO_REPLY_MAX_BACKOFF_SECONDS:900}
    knowledge-document-parse:
      max-retry-count: ${MT_ASYNC_TASK_KNOWLEDGE_DOCUMENT_PARSE_MAX_RETRY_COUNT:3}
      timeout-seconds: ${MT_ASYNC_TASK_KNOWLEDGE_DOCUMENT_PARSE_TIMEOUT_SECONDS:600}
      initial-backoff-seconds: ${MT_ASYNC_TASK_KNOWLEDGE_DOCUMENT_PARSE_INITIAL_BACKOFF_SECONDS:60}
      max-backoff-seconds: ${MT_ASYNC_TASK_KNOWLEDGE_DOCUMENT_PARSE_MAX_BACKOFF_SECONDS:900}
  comment:
    pull-cron: ${MT_COMMENT_PULL_CRON:0 0 8,13,19 * * ?}
    lookback-days: ${MT_COMMENT_LOOKBACK_DAYS:7}
    page-size: ${MT_COMMENT_PAGE_SIZE:20}
    query-dry-run: ${MT_COMMENT_QUERY_DRY_RUN:false}
    reply-dry-run: ${MT_COMMENT_REPLY_DRY_RUN:false}
    complaint-dry-run: ${MT_COMMENT_REPLY_DRY_RUN:false}
    dry-run-reschedule-seconds: ${MT_COMMENT_DRY_RUN_RESCHEDULE_SECONDS:3600}
    default-reply: ${MT_COMMENT_DEFAULT_REPLY:很好}
    sensitive-word:
      enabled: ${MT_COMMENT_SENSITIVE_WORD_ENABLED:true}
      max-rewrite-attempts: ${MT_COMMENT_SENSITIVE_WORD_MAX_REWRITE_ATTEMPTS:1}
    knowledge:
      enabled: ${MT_COMMENT_KNOWLEDGE_ENABLED:true}
      max-qa-items-per-shop: ${MT_COMMENT_KNOWLEDGE_MAX_QA_ITEMS_PER_SHOP:500}
      max-documents-per-shop: ${MT_COMMENT_KNOWLEDGE_MAX_DOCUMENTS_PER_SHOP:10}
      max-document-bytes: ${MT_COMMENT_KNOWLEDGE_MAX_DOCUMENT_BYTES:20971520}
      max-chunks-per-document: ${MT_COMMENT_KNOWLEDGE_MAX_CHUNKS_PER_DOCUMENT:500}
      max-search-candidates: ${MT_COMMENT_KNOWLEDGE_MAX_SEARCH_CANDIDATES:1000}
      top-k: ${MT_COMMENT_KNOWLEDGE_TOP_K:5}
      min-context-cosine-score: ${MT_COMMENT_KNOWLEDGE_MIN_CONTEXT_COSINE_SCORE:0.75}
      rag-balance-threshold: ${MT_COMMENT_KNOWLEDGE_RAG_BALANCE_THRESHOLD:100000}
      auth-grant-power-amount: ${MT_COMMENT_KNOWLEDGE_AUTH_GRANT_POWER_AMOUNT:${POWER_NEW_AUTHORIZED_SHOP_GRANT_AMOUNT:800000}}
      model-base-url: ${MT_COMMENT_KNOWLEDGE_MODEL_BASE_URL:https://tokenhub.tencentmaas.com/v1}
      model-api-key: ${MT_COMMENT_KNOWLEDGE_MODEL_API_KEY:}
      chat-model: ${MT_COMMENT_KNOWLEDGE_CHAT_MODEL:deepseek-v4-flash}
      embedding-provider: ${MT_COMMENT_KNOWLEDGE_EMBEDDING_PROVIDER:DASHSCOPE}
      embedding-base-url: ${MT_COMMENT_KNOWLEDGE_EMBEDDING_BASE_URL:https://llm-kz8j7o34hwdm6nb4.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      embedding-api-key: ${MT_COMMENT_KNOWLEDGE_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
      embedding-model: ${MT_COMMENT_KNOWLEDGE_EMBEDDING_MODEL:text-embedding-v4}
      embedding-dim: ${MT_COMMENT_KNOWLEDGE_EMBEDDING_DIM:1024}
      document-key-prefix: ${MT_COMMENT_KNOWLEDGE_DOCUMENT_KEY_PREFIX:comment-knowledge/documents}
      vision-enabled: ${MT_COMMENT_KNOWLEDGE_VISION_ENABLED:true}
      vision-model-base-url: ${MT_COMMENT_KNOWLEDGE_VISION_MODEL_BASE_URL:https://tokenhub.tencentmaas.com/v1}
      vision-model-api-key: ${MT_COMMENT_KNOWLEDGE_VISION_MODEL_API_KEY:${MT_COMMENT_KNOWLEDGE_MODEL_API_KEY:}}
      vision-model: ${MT_COMMENT_KNOWLEDGE_VISION_MODEL:qwen3.5-flash}
      vision-max-image-count: ${MT_COMMENT_KNOWLEDGE_VISION_MAX_IMAGE_COUNT:3}
      vision-timeout-seconds: ${MT_COMMENT_KNOWLEDGE_VISION_TIMEOUT_SECONDS:30}
      vision-fallback-power-amount: ${MT_COMMENT_KNOWLEDGE_VISION_FALLBACK_POWER_AMOUNT:1000}
      vision-image-key-prefix: ${MT_COMMENT_KNOWLEDGE_VISION_IMAGE_KEY_PREFIX:comment-knowledge/vision-images}
      vision-temp-image-key-prefix: ${MT_COMMENT_KNOWLEDGE_VISION_TEMP_IMAGE_KEY_PREFIX:comment-knowledge/vision-temp-images}
      fallback-rag-power-amount: ${MT_COMMENT_KNOWLEDGE_FALLBACK_RAG_POWER_AMOUNT:1000}

youzan:
  client-id: ${YOUZAN_CLIENT_ID:}
  client-secret: ${YOUZAN_CLIENT_SECRET:}
  token-url: ${YOUZAN_TOKEN_URL:https://open.youzanyun.com/auth/token}
  callback:
    url-charset: ${YOUZAN_CALLBACK_URL_CHARSET:GBK}
  token:
    refresh-cron: ${YOUZAN_TOKEN_REFRESH_CRON:0 */10 * * * ?}
