schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  本仓库的业务文档和 OpenSpec 产物默认使用中文编写。
  只有代码标识、数据库字段、接口名、配置项、专有技术名词、OpenSpec 固定结构标题保留英文。
  业务术语优先使用仓库现有中文表达，例如门店、权益、授权、订阅订单、算力、推广策略。
  如果专业英文术语更精确，可以保留英文并在必要时用中文解释。

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - 默认用中文描述背景、变更、影响；保留 Why、What Changes、Capabilities、Impact 等 OpenSpec 固定标题。
  design:
    - 默认用中文描述设计决策；保留 Context、Goals / Non-Goals、Decisions、Risks / Trade-offs 等 OpenSpec 固定标题。
  specs:
    - 默认用中文编写 requirement 名称、场景名称和 WHEN/THEN 内容；保留 ADDED/MODIFIED Requirements、Requirement、Scenario、WHEN、THEN 等 OpenSpec 关键结构。
  tasks:
    - 默认用中文编写任务分组和任务描述；必须保留 `- [ ]` checkbox 格式。
